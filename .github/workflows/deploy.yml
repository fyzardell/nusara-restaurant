name: Deploy NUSARA to VPS aaPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Tencent Cloud VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # 1. Environment & Path Resolution (aaPanel compatible)
            export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/www/server/php/85/bin:/www/server/php/84/bin:/www/server/php/83/bin:/www/server/php/82/bin:/www/server/nodejs/v*/bin:$PATH
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            # 2. Update Composer binary jika masih versi lama (kompatibilitas PHP 8.4/8.5)
            if ! composer --version 2>/dev/null | grep -q "Composer version 2\.[7-9]\|Composer version 2\.[1-9][0-9]"; then
              echo "Memperbarui binary Composer ke versi terbaru yang kompatibel dengan PHP 8.5..."
              curl -sS https://getcomposer.org/composer.phar -o /usr/local/bin/composer || true
              chmod +x /usr/local/bin/composer || true
              cp /usr/local/bin/composer /usr/bin/composer 2>/dev/null || true
            fi

            # Git safe directory
            git config --global --add safe.directory "*" || true

            # Pindah ke direktori project website di aaPanel
            cd "${{ secrets.APP_DIR || '/www/wwwroot/nusara.my.id' }}"

            echo "================================================="
            echo "1. MENARIK PERUBAHAN DARI GITHUB"
            echo "================================================="
            git fetch origin main
            git reset --hard origin/main

            echo "================================================="
            echo "2. INSTALL DEPENDENSI PHP (COMPOSER)"
            echo "================================================="
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

            echo "================================================="
            echo "3. BUILD ASSET FRONTEND (VITE / INERTIA REACT)"
            echo "================================================="
            npm install
            npm run build

            echo "================================================="
            echo "4. MIGRASI DATABASE"
            echo "================================================="
            php artisan migrate --force

            echo "================================================="
            echo "5. OPTIMASI CACHE LARAVEL"
            echo "================================================="
            php artisan optimize:clear
            php artisan config:cache
            php artisan event:cache
            php artisan route:cache
            php artisan view:cache

            echo "================================================="
            echo "6. PERBAIKI HAK AKSES FOLDER (CHOWN WWW)"
            echo "================================================="
            chown -R www:www .
            chmod -R 775 storage bootstrap/cache

            echo "================================================="
            echo "DEPLOYMENT SELESAI DENGAN SUKSES & AMAN!"
            echo "================================================="
