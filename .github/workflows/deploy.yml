name: Deploy NUSARA to VPS aaPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Tencent Cloud VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # 1. Environment & Path Resolution (aaPanel compatible)
            export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/www/server/php/85/bin:/www/server/php/84/bin:/www/server/php/83/bin:/www/server/php/82/bin:/www/server/nodejs/v*/bin:$PATH
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            # Git safe directory
            git config --global --add safe.directory "*" || true

            # Aktifkan fungsi chown, chgrp, proc_open, putenv di semua php.ini untuk Composer
            ACTIVE_INI=$(php -r "echo php_ini_loaded_file();" 2>/dev/null || true)
            ALL_INIS="$ACTIVE_INI $(find /www/server/php /etc/php -name '*.ini' 2>/dev/null || true)"
            for ini_file in $ALL_INIS; do
              if [ -f "$ini_file" ]; then
                sed -i 's/chgrp//g; s/chown//g; s/proc_open//g; s/putenv//g' "$ini_file"
                sed -i 's/,\s*,/,/g; s/=\s*,/=/g; s/,\s*$//g' "$ini_file"
              fi
            done

            # Pindah ke direktori project website di aaPanel
            cd "${{ secrets.APP_DIR || '/www/wwwroot/nusara.my.id' }}"

            echo "================================================="
            echo "1. MENARIK PERUBAHAN DARI GITHUB"
            echo "================================================="
            git fetch origin main
            git reset --hard origin/main

            # Pastikan file .env ada dan terkonfigurasi dengan benar
            if [ ! -f .env ]; then
              echo "Membuat file .env dari .env.example..."
              cp .env.example .env
              sed -i 's/APP_ENV=local/APP_ENV=production/g' .env
              sed -i 's/APP_DEBUG=true/APP_DEBUG=false/g' .env
              sed -i 's|APP_URL=http://localhost:8000|APP_URL=https://nusara.my.id|g' .env
              sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/g' .env
              php artisan key:generate --force
            fi

            # Pastikan database sqlite ada jika menggunakan sqlite
            mkdir -p database
            if [ ! -f database/database.sqlite ]; then
              touch database/database.sqlite
            fi
            chmod -R 775 database
            chmod 664 database/database.sqlite 2>/dev/null || true

            echo "================================================="
            echo "2. INSTALL DEPENDENSI PHP (COMPOSER)"
            echo "================================================="
            export COMPOSER_ALLOW_SUPERUSER=1
            # Download composer.phar resmi terbaru langsung untuk menjamin kompatibilitas PHP 8.5
            curl -sS https://getcomposer.org/composer.phar -o composer.phar
            chmod +x composer.phar
            cp composer.phar /usr/bin/composer 2>/dev/null || true
            cp composer.phar /usr/local/bin/composer 2>/dev/null || true

            php -d disable_functions="" composer.phar install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

            echo "================================================="
            echo "3. BUILD ASSET FRONTEND (VITE / INERTIA REACT)"
            echo "================================================="
            if ! command -v npm >/dev/null 2>&1; then
              for node_bin in /www/server/nodejs/v*/bin /usr/local/bin /root/.nvm/versions/node/*/bin; do
                if [ -f "$node_bin/npm" ]; then
                  export PATH="$node_bin:$PATH"
                  break
                fi
              done
            fi
            npm install
            npm run build

            echo "================================================="
            echo "4. MIGRASI & SEED DATABASE"
            echo "================================================="
            php artisan migrate --force
            php artisan db:seed --force || true

            echo "================================================="
            echo "5. OPTIMASI CACHE LARAVEL"
            echo "================================================="
            php artisan optimize:clear
            php artisan config:cache
            php artisan event:cache
            php artisan route:cache
            php artisan view:cache

            echo "================================================="
            echo "6. PERBAIKI HAK AKSES FOLDER (CHOWN WWW)"
            echo "================================================="
            chown -R www:www .
            chmod -R 775 storage bootstrap/cache database
            chmod 664 database/database.sqlite 2>/dev/null || true

            echo "================================================="
            echo "DEPLOYMENT SELESAI DENGAN SUKSES & AMAN!"
            echo "================================================="
