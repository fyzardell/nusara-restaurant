name: Deploy NUSARA to VPS aaPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Tencent Cloud VPS
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands for deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            # Pastikan binary PHP, Composer, dan Node.js terbaca di non-interactive SSH aaPanel
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/www/server/php/82/bin:/www/server/php/83/bin:/www/server/php/84/bin:/www/server/php/85/bin
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Pindah ke direktori project website di aaPanel
            cd ${{ secrets.APP_DIR || '/www/wwwroot/nusara.my.id' }}

            echo "================================================="
            echo "🚀 1. MENARIK PERUBAHAN DARI GITHUB (ANTI-CONFLICT)"
            echo "================================================="
            git fetch origin main
            git reset --hard origin/main

            echo "================================================="
            echo "📦 2. INSTALL DEPENDENSI PHP (COMPOSER)"
            echo "================================================="
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --ignore-platform-reqs

            echo "================================================="
            echo "⚡ 3. BUILD ASSET FRONTEND (VITE / INERTIA REACT)"
            echo "================================================="
            # Cek jika nvm tersedia di server aaPanel
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            npm install
            npm run build

            echo "================================================="
            echo "🗄️ 4. MIGRASI DATABASE"
            echo "================================================="
            php artisan migrate --force

            echo "================================================="
            echo "⚡ 5. OPTIMASI CACHE LARAVEL"
            echo "================================================="
            php artisan optimize:clear
            php artisan config:cache
            php artisan event:cache
            php artisan route:cache
            php artisan view:cache

            echo "================================================="
            echo "🔒 6. PERBAIKI HAK AKSES FOLDER (CHOWN WWW)"
            echo "================================================="
            chown -R www:www .
            chmod -R 775 storage bootstrap/cache

            echo "================================================="
            echo "✅ DEPLOYMENT SELESAI DENGAN SUKSES & AMAN!"
            echo "================================================="
